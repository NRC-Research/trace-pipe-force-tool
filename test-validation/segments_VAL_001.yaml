    direction_vector: [1.0, 0.0, 0.0]  # Flow is along X-axis
    components:
      - id: 20
        type: "pipe"
        cells: [1, 2, 3, 4]
        cell_length: 1.0
    inlet_junction:
      type: "BOUNDED"
      id: 10
    outlet_junction:
      type: "BOUNDED"
      id: 20
